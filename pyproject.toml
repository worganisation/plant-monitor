[project]
name = "plant-monitor"
version = "1.0.0"
description = "Grow HAT plant monitoring and MQTT controls"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "Will Garside", email = "worgarside@gmail.com"}]
dependencies = [
    "paho-mqtt>=2.1.0",
    "pydantic-settings>=2.12",
    "growhat>=0.0.3; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "rpi-lgpio>=0.6; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[dependency-groups]
dev = ["basedpyright>=1.39.7", "ruff>=0.16.2"]

[tool.uv]
package = false

[tool.basedpyright]
include = ["src"]
extraPaths = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.14"
reportMissingImports = "none"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.semantic_release]
tag_format = "{version}"
version_toml = ["pyproject.toml:project.version"]
major_on_zero = false
allow_zero_version = true
build_command = "python -m pip install uv && uv lock && git add uv.lock"

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "deps", "docs", "feat", "fix", "hotfix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["build", "deps", "fix", "hotfix", "perf"]
parse_squash_commits = false
