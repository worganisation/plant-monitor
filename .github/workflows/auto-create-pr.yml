---
name: Auto-Create PR

on:
  push:
    branches-ignore:
      - main
      - dependabot/**
  workflow_dispatch:

jobs:
  create-pr:
    name: Create PR
    # yamllint disable-line rule:line-length
    uses: worganisation/github-config-files/.github/workflows/__create-pull-request.yml@0.10.0
    with:
      base-ref-name: ${{ github.event.repository.default_branch }}
      head-ref-name: ${{ github.ref_name }}
      pr-draft: true
      update-pr-body-if-exists: true
    secrets: inherit
